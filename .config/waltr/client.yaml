version: 1
keybinds:
  - id: dictate-copy
    key: Ctrl+Alt+Space
    mode: hold
    routine:
      name: audio-transcribe
      trigger: dictate
      input: audio
      output: transcript
    audio:
      device: default
      sampleRateHz: 24000
      channels: 1
    typing: {}
  - id: dictate-cleanup-copy
    key: Ctrl+Alt+Super+Space
    mode: hold
    routine:
      name: audio-transcribe-cleanup
      trigger: dictate
      input: audio
      output: clean-text
    audio:
      device: default
      sampleRateHz: 24000
      channels: 1
    command:
      argv: [pbcopy]
      stdin: '{{ text }}'
      timeoutSeconds: 10
  - id: conversation-notes-copy
    key: Ctrl+Alt+Shift+Space
    mode: hold
    maxCaptureSeconds: 3600
    routine:
      name: audio-conversation-notes
      trigger: record-notes
      input: audio
      output: notes
    audio:
      device: default
      sampleRateHz: 24000
      channels: 1
    command:
      argv: [/usr/bin/pbcopy]
      stdin: '{{ text }}'
      timeoutSeconds: 10
